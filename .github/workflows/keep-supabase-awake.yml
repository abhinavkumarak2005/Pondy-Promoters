name: Keep Supabase Awake

on:
  schedule:
    # Runs at 00:00 every Monday and Thursday to prevent the free tier from pausing
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Properties Table
        run: |
          curl -s -X GET "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/properties?select=id&limit=1" \
          -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}"
